<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tiny Invites QA Runner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    button {
      background: #4f46e5;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 10px;
    }

    button:hover {
      opacity: 0.9;
    }

    .stats {
      margin: 20px 0;
      display: flex;
      gap: 20px;
    }

    .box {
      padding: 12px;
      border-radius: 8px;
      min-width: 80px;
      text-align: center;
      background: #111;
    }

    .pass { color: #22c55e; }
    .fail { color: #ef4444; }
    .warn { color: #f59e0b; }
    .skip { color: #9ca3af; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #111;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #222;
      text-align: left;
      font-size: 14px;
    }

    tr:hover {
      background: #1a1a1a;
    }

    .status-badge {
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: bold;
    }

    .PASS { background: #052e16; color: #22c55e; }
    .FAIL { background: #2d0a0a; color: #ef4444; }
    .WARN { background: #2d1800; color: #f59e0b; }
    .SKIP { background: #1a1a1a; color: #9ca3af; }
  </style>
</head>
<body>

  <h1>Tiny Invites QA Runner</h1>

  <button onclick="runAllTests()">Run All Tests</button>
  <button onclick="clearResults()">Clear</button>

  <div class="stats">
    <div class="box"><div id="passCount" class="pass">0</div>PASS</div>
    <div class="box"><div id="failCount" class="fail">0</div>FAIL</div>
    <div class="box"><div id="warnCount" class="warn">0</div>WARN</div>
    <div class="box"><div id="skipCount" class="skip">0</div>SKIP</div>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Test</th>
        <th>Status</th>
        <th>Notes</th>
        <th>Time</th>
      </tr>
    </thead>
    <tbody id="resultsTable"></tbody>
  </table>

  <script>
    const BASE = window.location.origin;

    const TESTS = [
      {
        id: "TC01",
        label: "Homepage loads",
        fn: async function () {
          const t0 = Date.now();

          try {
            const res = await fetch(BASE);

            return {
              status: res.ok ? "PASS" : "FAIL",
              notes: "HTTP " + res.status,
              time: Date.now() - t0
            };
          } catch (e) {
            return {
              status: "FAIL",
              notes: e.message,
              time: Date.now() - t0
            };
          }
        }
      },

      {
        id: "TC02",
        label: "Create-party rejects empty payload",
        fn: async function () {
          const t0 = Date.now();

          try {
            const res = await fetch(BASE + "/api/create-party", {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({})
            });

            return {
              status:
                (res.status === 400 || res.status === 422) ? "PASS" : "FAIL",
              notes: "HTTP " + res.status,
              time: Date.now() - t0
            };
          } catch (e) {
            return {
              status: "SKIP",
              notes: e.message,
              time: Date.now() - t0
            };
          }
        }
      },

      {
        id: "TC03",
        label: "Fake dashboard token blocked",
        fn: async function () {
          const t0 = Date.now();

          try {
            const res = await fetch(BASE + "/dashboard/fake-token-123");

            return {
              status:
                [401, 403, 404].includes(res.status) ? "PASS" : "FAIL",
              notes: "HTTP " + res.status,
              time: Date.now() - t0
            };
          } catch (e) {
            return {
              status: "SKIP",
              notes: e.message,
              time: Date.now() - t0
            };
          }
        }
      }
    ];

    function renderRow(test, result) {
      const row = document.createElement("tr");

      row.innerHTML =
        "<td>" + test.id + "</td>" +
        "<td>" + test.label + "</td>" +
        "<td><span class='status-badge " + result.status + "'>" + result.status + "</span></td>" +
        "<td>" + result.notes + "</td>" +
        "<td>" + result.time + "ms</td>";

      document.getElementById("resultsTable").appendChild(row);
    }

    function updateCounters(results) {
      let pass = 0;
      let fail = 0;
      let warn = 0;
      let skip = 0;

      results.forEach(function (r) {
        if (r.status === "PASS") pass++;
        if (r.status === "FAIL") fail++;
        if (r.status === "WARN") warn++;
        if (r.status === "SKIP") skip++;
      });

      document.getElementById("passCount").textContent = pass;
      document.getElementById("failCount").textContent = fail;
      document.getElementById("warnCount").textContent = warn;
      document.getElementById("skipCount").textContent = skip;
    }

    window.runAllTests = async function () {
      window.clearResults();

      const results = [];

      for (const test of TESTS) {
        const result = await test.fn();
        results.push(result);
        renderRow(test, result);
        updateCounters(results);
      }
    };

    window.clearResults = function () {
      document.getElementById("resultsTable").innerHTML = "";

      document.getElementById("passCount").textContent = 0;
      document.getElementById("failCount").textContent = 0;
      document.getElementById("warnCount").textContent = 0;
      document.getElementById("skipCount").textContent = 0;
    };
  </script>

</body>
</html>
