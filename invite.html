<div class="invite-card">

  <h1 id="title"></h1>

  <p id="details"></p>

  <h2>Will you attend?</h2>

  <form id="rsvpForm">

    <label>
      <input type="radio" name="attendance" value="yes">
      Yes 🎉
    </label>

    <label>
      <input type="radio" name="attendance" value="no">
      No 😢
    </label>

    <div id="allergyBox" style="display:none;">
      <textarea
        placeholder="Any allergies or important info?"
      ></textarea>
    </div>

    <button type="submit">
      Send RSVP
    </button>

  </form>

</div>
