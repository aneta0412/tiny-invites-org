<style>
:root{
  --cream:#faf6ef;--warm-white:#fff9f2;--gold:#c9a84c;--gold-pale:#f5edda;--gold-light:#e8d5a3;
  --dark:#2a2218;--ink:#2a2218;--mid:#6b5c45;--ink2:#6b5c45;--soft:#a89880;--muted:#a89880;
  --line:#f5edda;--white:#fff9f2;
  --shadow:0 4px 24px rgba(201,168,76,.08);--shadow2:0 12px 48px rgba(201,168,76,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif;font-weight:300}

/* NAV */
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 40px;background:var(--warm-white);border-bottom:1px solid var(--gold-pale)}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.4rem;letter-spacing:.04em;text-decoration:none;color:var(--ink)}
.logo-dot{color:var(--gold)}
.nav-back{font-size:0.82rem;color:var(--mid);text-decoration:none;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.nav-back:hover{color:var(--gold)}

/* PAGE LAYOUT */
.page{max-width:780px;margin:0 auto;padding:48px 40px 80px}
@media(max-width:600px){.page{padding:28px 20px 60px}nav{padding:16px 20px}}

/* BREADCRUMB */
.breadcrumb{font-size:0.75rem;color:var(--muted);margin-bottom:28px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.breadcrumb a{color:var(--muted);text-decoration:none}
.breadcrumb a:hover{color:var(--gold)}
.breadcrumb span{opacity:.5}

/* HERO */
.venue-cat-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;border-radius:2px;font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px;background:var(--gold-pale);color:var(--gold)}
h1.venue-h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,5vw,3rem);font-weight:300;line-height:1.1;color:var(--ink);margin-bottom:12px}
h2.venue-h2{font-family:'Cormorant Garamond',serif;font-size:clamp(1.1rem,3vw,1.5rem);font-weight:300;font-style:italic;color:var(--gold);margin-bottom:20px;line-height:1.3}
.venue-meta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.vm-badge{background:white;border:1px solid var(--line);border-radius:2px;padding:6px 14px;font-size:12px;color:var(--mid)}
.vm-badge strong{color:var(--ink);font-weight:500}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--gold-light),transparent);margin:28px 0}

/* ABOUT */
.about-text{font-size:0.95rem;line-height:1.75;color:var(--ink2);margin-bottom:8px}

/* SECTION HEADINGS */
h3.section-h3{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:400;color:var(--ink);margin:32px 0 16px}
.section-label{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}

/* INCLUSIONS */
.inc-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.inc-chip{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:2px;font-size:13px}
.inc-chip.yes{background:rgba(122,143,90,.12);color:#4a7a2a;border:1px solid rgba(122,143,90,.25)}
.inc-chip.no{background:rgba(200,122,90,.1);color:#a05030;border:1px solid rgba(200,122,90,.2)}
.inc-chip.opt{background:var(--gold-pale);color:var(--gold);border:1px solid var(--gold-light)}

/* PACKAGES */
.packages{display:flex;flex-direction:column;gap:14px;margin-bottom:28px}
.pkg{background:white;border:1px solid var(--line);border-radius:4px;padding:20px 22px;position:relative;overflow:hidden}
.pkg.featured{border-color:var(--gold)}
.pkg.featured::before{content:'MOST POPULAR';position:absolute;top:13px;right:-28px;background:var(--gold);color:white;font-size:9px;font-weight:500;letter-spacing:.1em;padding:4px 40px;transform:rotate(35deg)}
.pkg-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:10px}
.pkg-name{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:400;color:var(--ink)}
.pkg-price-box{background:var(--gold-pale);border:1px solid var(--gold-light);border-radius:3px;padding:8px 14px;text-align:right;flex-shrink:0}
.pkg-price-main{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:400;color:var(--ink);line-height:1}
.pkg-price-note{font-size:10px;color:var(--muted);margin-top:3px;max-width:180px;line-height:1.3}
.pkg-kids{font-size:12px;color:var(--muted);margin-bottom:12px}
.pkg-items{display:flex;flex-direction:column;gap:5px}
.pi{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ink2);line-height:1.5}
.pi-dot{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;margin-top:2px}
.pi-dot.y{background:rgba(122,143,90,.2);color:#4a7a2a}
.pi-dot.n{background:rgba(200,122,90,.15);color:#a05030}
.pkg-slots{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

/* EXTRAS */
.extras-box{background:var(--warm-white);border:1px solid var(--line);border-radius:4px;padding:18px 20px;margin-bottom:24px}
.extras-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.extra-tag{padding:4px 12px;border-radius:2px;background:white;border:1px solid var(--line);font-size:12px;color:var(--ink2)}

/* NOTES */
.notes-box{background:var(--gold-pale);border:1px solid var(--gold-light);border-radius:4px;padding:18px 20px;margin-bottom:28px;font-size:13px;color:var(--ink2);line-height:1.65}
.notes-box strong{color:var(--ink);font-weight:500}

/* CTA */
.cta-section{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:32px;padding-top:28px;border-top:1px solid var(--line)}
.btn-primary{display:inline-block;padding:13px 28px;background:var(--ink);color:var(--cream);text-decoration:none;border-radius:3px;font-size:0.85rem;font-weight:400;letter-spacing:.07em;text-transform:uppercase;transition:background .2s}
.btn-primary:hover{background:var(--gold)}
.btn-ghost{display:inline-block;padding:13px 28px;background:transparent;color:var(--mid);text-decoration:none;border-radius:3px;font-size:0.85rem;border:1px solid var(--line);transition:all .2s;letter-spacing:.04em}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}

/* NOT FOUND */
.not-found{text-align:center;padding:80px 20px}
.not-found h2{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;margin-bottom:12px}
.not-found p{color:var(--muted);margin-bottom:24px}

footer{padding:28px 40px;text-align:center;font-size:0.78rem;color:var(--soft,#a89880);border-top:1px solid var(--gold-pale)}
footer a{color:var(--mid);text-decoration:none}
footer a:hover{color:var(--gold)}
</style>

// Normalise: strip spaces, uppercase, try longest match first
function getCoords(raw){
  // Use outward code only (before the space) to avoid "OX1 1AA" → "OX11AA" matching OX11
  const parts=raw.trim().toUpperCase().split(/\s+/);
  const c=parts[0]; // e.g. "OX1" from "OX1 1AA", or "GL56" from "GL56 0DS"
  for(let len=Math.min(c.length,5);len>=1;len--){
    const k=c.slice(0,len);
    if(PC[k]) return PC[k];
  }
  // Fallback: try full stripped string (for single-word entries like "CV37")
  const full=raw.trim().toUpperCase().replace(/\s+/g,"");
  for(let len=Math.min(full.length,5);len>=1;len--){
    const k=full.slice(0,len);
    if(PC[k]) return PC[k];
  }
  return null;
}


function hav(a,b,c,d){
  const R=3959,dLat=(c-a)*Math.PI/180,dLng=(d-b)*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// Little Party Finder — Complete Venue Database

// Venues now load from /api/venues (single Supabase source of truth) — no inline list.

// ── READ URL PARAM ──
const params = new URLSearchParams(window.location.search);
const venueSlug = params.get("venue");  // e.g. jnb-academy-stratford-upon-avon
const venueIdFallback = parseInt(params.get("id"));  // legacy fallback

const CAT_LABELS = {
  soft:"Soft Play",gym:"Gymnastics",bounce:"Trampoline & Bounce",swim:"Swimming",
  farm:"Farm & Outdoors",club:"Health Club",unique:"Unique Experience",leisure:"Leisure Centre",
  mobile:"Comes to You"
};
const CAT_EMOJI = {
  soft:"🎪",gym:"🤸",bounce:"🦘",swim:"🏊",farm:"🌿",club:"⭐",unique:"✨",leisure:"🏛️",mobile:"🚐"
};

function slugify(name){
  return name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}

function renderVenue(v){
  // Update page meta
  document.getElementById("pageTitle").textContent = v.metaTitle || v.name + " Birthday Parties | Tiny Invites";
  document.getElementById("pageDesc").setAttribute("content", v.metaDesc || "");
  document.getElementById("ogTitle").setAttribute("content", v.metaTitle || v.name);
  document.getElementById("ogDesc").setAttribute("content", v.metaDesc || "");
  const slug = slugify(v.name);
  document.getElementById("pageCanonical").setAttribute("href", "https://tinyinvites.org/venue.html?venue=" + (v.slug||v.id));

  const catLabel = CAT_LABELS[v.cat] || v.cat;
  const catEmoji = CAT_EMOJI[v.cat] || "🎉";

  const pkgsHtml = v.packages.map(p => `
    <div class="pkg${(p.featured && v.packages.length > 1) ? " featured" : ""}">
      <div class="pkg-top">
        <div class="pkg-name">${p.name}</div>
        <div class="pkg-price-box">
          <div class="pkg-price-main">${p.price}</div>
          <div class="pkg-price-note">${p.priceNote || ""}</div>
        </div>
      </div>
      <div class="pkg-kids">👶 ${p.maxKids}</div>
      <div class="pkg-items">
        ${(p.includes||[]).map(i=>`<div class="pi"><span class="pi-dot y">✓</span>${i}</div>`).join("")}
        ${(p.excludes||[]).map(i=>`<div class="pi"><span class="pi-dot n">✗</span>${i}</div>`).join("")}
      </div>
      ${p.slots ? `<div class="pkg-slots">⏰ <strong>Booking slots:</strong> ${p.slots}</div>` : ""}
    </div>`).join("");

  const extrasHtml = v.extras?.length ? `
    <div class="extras-box">
      <div class="section-label">Optional extras & add-ons</div>
      <div class="extras-list">${v.extras.map(e=>`<span class="extra-tag">✚ ${e}</span>`).join("")}</div>
    </div>` : "";

  const notesHtml = v.notes ? `
    <div class="notes-box">💡 <strong>Good to know:</strong> ${v.notes}</div>` : "";

  const foodLabel = v.food==="yes" ? "Food included" : v.food==="opt" ? "Food optional" : "Self-catered";
  const bagsLabel = v.bags==="yes" ? "Gift bags included" : v.bags==="opt" ? "Bags available" : "No gift bags";
  const foodClass = v.food==="yes" ? "yes" : v.food==="opt" ? "opt" : "no";
  const bagsClass = v.bags==="yes" ? "yes" : v.bags==="opt" ? "opt" : "no";

  document.getElementById("pageContent").innerHTML = `
    <div class="breadcrumb">
      <a href="/">Home</a><span>/</span>
      <a href="/partyfinder.html">Party Finder</a><span>/</span>
      <span>${v.name}</span>
    </div>

    <div class="venue-cat-tag">${catEmoji} ${catLabel}</div>
    <h1 class="venue-h1">${v.h1 || v.name + " Birthday Parties"}</h1>
    <h2 class="venue-h2">${v.h2 || v.sub}</h2>

    <div class="venue-meta">
      <div class="vm-badge">📌 <strong>${v.city}</strong>, ${v.postcode}</div>
      <div class="vm-badge">👶 Ages <strong>${v.ages}</strong></div>
      <div class="vm-badge">👧 Up to <strong>${v.maxKids}</strong> children</div>
      <div class="vm-badge">⏱ <strong>${v.duration}</strong></div>
    </div>

    <div class="divider"></div>

    <div class="section-label">About this venue</div>
    <p class="about-text">${v.shortDesc}</p>

    <div class="inc-row" style="margin-top:16px">
      <div class="inc-chip yes">✓ Venue & private space</div>
      <div class="inc-chip ${foodClass}">🍕 ${foodLabel}</div>
      <div class="inc-chip ${bagsClass}">🎁 ${bagsLabel}</div>
    </div>

    <div class="divider"></div>

    <h3 class="section-h3">${v.h3 || "Party Packages &amp; Prices"}</h3>
    <div class="packages">${pkgsHtml}</div>

    ${extrasHtml}
    ${notesHtml}

    <div class="cta-section">
      <a href="${v.website}" target="_blank" rel="noopener" class="btn-primary">Visit website &amp; book →</a>
      <a href="/partyfinder.html" class="btn-ghost">← All venues</a>
    </div>`;
}

// ── BOOT ──
function findVenue(list){
  if(venueSlug)               return list.find(v => v.slug === venueSlug);
  if(!isNaN(venueIdFallback)) return list.find(v => v.id === venueIdFallback);
  return null;
}
function showNotFound(){
  document.getElementById("pageContent").innerHTML = (!venueSlug && isNaN(venueIdFallback))
    ? `<div class="not-found"><h2>Venue not found</h2><p>No venue specified.</p><a href="/partyfinder.html" class="btn-primary">Browse all venues</a></div>`
    : `<div class="not-found"><h2>Venue not found</h2><p>We couldn't find the venue "<strong>${venueSlug||venueIdFallback}</strong>".</p><a href="/partyfinder.html" class="btn-primary">Browse all venues</a></div>`;
}
(async function(){
  // Fully API-driven: venues come from the shared Supabase list (/api/venues),
  // the single source of truth, so this page never goes stale.
  if(!venueSlug && isNaN(venueIdFallback)){ showNotFound(); return; }
  document.getElementById("pageContent").innerHTML = `<div class="not-found"><h2>Loading venue…</h2></div>`;
  let venue=null, offline=false;
  try{
    const res = await fetch('/api/venues');
    if(res.ok){ const data = await res.json(); if(data && Array.isArray(data.venues)) venue = findVenue(data.venues); }
    else offline=true;
  }catch(e){ offline=true; }
  if(venue) renderVenue(venue);
  else if(offline) document.getElementById("pageContent").innerHTML = `<div class="not-found"><h2>Couldn't load venues</h2><p>Please check your connection and try again.</p><a href="/partyfinder.html" class="btn-primary">Browse all venues</a></div>`;
  else showNotFound();
})();
</script>
